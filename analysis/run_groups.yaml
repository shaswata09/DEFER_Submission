# Runs whose logs sit in a main group's log directory but belong to a
# separate experiment. parse_logs names a run's group after its log
# directory and keeps the last run per (ap, variant, trial, config), so a
# later experiment that reuses a directory and a config label silently
# replaces the earlier rows. Listing the log files here routes them to
# their own group instead; the log files themselves are never moved or
# edited.

q235_div4_e9:
  reason: >-
    E9 (judged writes to critical stores). Both arms, agenticcyops and
    agenticcyops_writejudge, ran at defense-freeze-v2.8 in the main
    q235_div4 log directories on the same AP-2/AP-4/AP-13 and benign cells
    as the reported FULL runs, so the agenticcyops arm replaced those rows.
