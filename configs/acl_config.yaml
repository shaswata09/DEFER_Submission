# ACL-Hardened Configuration
# Network-level ACLs restrict agent->tool and agent->memory.
# No consensus, no MMA, no write filtering.
# Tests whether simple access control is sufficient.

name: acl_hardened
description: "Network ACLs only, no architectural defenses"

enforcement:
  manifest_check: false    # no application-level check
  consensus: false
  mma_gateway: false
  write_filter: false
  acl_layer: true          # HTTP 403 on out-of-scope calls

agent_tool_visibility: all  # agents see all 16 tools (but ACL blocks calls)
memory_access: direct_with_acl  # ChromaDB with ACL check, no write filtering
agent_communication: peer_to_peer
escalation: never
